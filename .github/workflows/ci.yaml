name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2.18
        with:
          path: "./hostwatch"
      - name: Python syntax check
        run: python3 -m py_compile hostwatch/run.py
